server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://backend:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite's built JS/CSS filenames are content-hashed (e.g.
    # index-BiZMHl2o.js) - a filename never changes meaning, so these are
    # safe to cache aggressively forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html is NOT hashed and references the current build's hashed
    # asset filenames - without an explicit no-cache here, a phone's browser
    # cache can keep serving a stale index.html (and therefore a stale JS
    # bundle) after a redeploy for a long time, only refreshing on a hard
    # reload. This is what made the Hostmodus rollout look like it silently
    # didn't work on a real device: the client was still running the
    # previous build.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
